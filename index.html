const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
async function put(c,o){o.id=o.id||uid();const i=D[c].findIndex(x=>x.id==o.id);i<0?D[c].push(o):D[c][i]=o;
 if(useFB)await db.collection(c).doc(o.id).set(o);else localStorage['b_'+c]=JSON.stringify(D[c]);return o}
async function rm(c,id){D[c]=D[c].filter(x=>x.id!=id);
 if(useFB)await db.collection(c).doc(id).delete();else localStorage['b_'+c]=JSON.stringify(D[c])}

 if(useFB){const s=await db.collection(c).get();D[c]=s.docs.map(d=>d.data())}
 else D[c]=JSON.parse(localStorage['b_'+c]||'[]')}}
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bq1'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(p)}}
function shrink(f){return new Promise(res=>{const fb=()=>{if(f.size>900000){alert('Photo trop lourde / الصورة كبيرة بزاف');return res('')}const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=()=>res('');r.readAsDataURL(f)};
 try{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const k=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.65))}catch(e){fb()}};im.onerror=fb;im.src=u}catch(e){fb()}})}

 S.user=x;sessionStorage.b_sess=x.id;S.view='home';r()}
async function mkAdmin(){const u=$('lu').value.trim().toLowerCase(),p=$('lp').value;if(!u||p.length<4)return alert('4+');
 await put('users',{username:u,name:$('ln').value||u,role:'admin',hash:await hash(p)});await doLogin()}

${first?`<input id=ln placeholder="${t('full')}">`:''}<input id=lu placeholder="${t('user')}" autocapitalize=off><input id=lp type=password placeholder="${t('pass')}">
<button class="btn p" style="width:100%" onclick="${first?'mkAdmin()':'doLogin()'}">${first?t('mkAdmin'):t('login')}</button>
<p style="text-align:center"><button class=btn onclick="toggleLang()">${S.lang=='fr'?'الدارجة':'Français'}</button></p></div></main>`}

function askQty(id){const i=D.items.find(x=>x.id==id),kg=isKg(i);S.qd={id,q:kg?1000:1,kg,i};

 <p>${t('price')}: <b>${dh(i.price)}${sfx(i)}</b></p>${typeof i.stock=='number'?`<p class=sm id=qs>${t('stock')}: ${i.stock}${kg?' kg':''}</p>`:''}<label>${t('qty')} ${kg?'(g)':''}</label>
 <div class=row><button class=btn onclick="qstep(-1)">−</button><input id=qv type=number inputmode=decimal value="${S.qd.q}" oninput="qdv()"><button class=btn onclick="qstep(1)">+</button></div>

 <button class="btn p" onclick="xl()">⬇ ${t('export')}</button>
 <div class="box sc"><table><tr><th>${t('day')}</th><th>${t('nb')}</th><th>${t('total')}</th><th>${t('profit')}</th></tr>${days.map(d=>`<tr><td>${d}</td><td>${g[d].n}</td><td>${dh(g[d].t)}</td><td class=g>${dh(g[d].b)}</td></tr>`).join('')}</table></div>
 <h3>👤 ${t('perf')}</h3><div class="box sc"><table><tr><th>${t('seller')}</th><th>${t('nb')}</th><th>${t('ca')}</th><th>${t('profit')}</th><th>%</th></tr>${Object.values(sv).sort((a,b)=>b.t-a.t).map(v=>`<tr><td>${esc(v.name)}</td><td>${v.n}</td><td><b>${dh(v.t)}</b></td><td class=g>${dh(v.b)}</td><td>${T?Math.round(v.t/T*100):0}%</td></tr>`).join('')||`<tr><td class=sm>${t('empty')}</td></tr>`}</table></div><h3>${t('history')}</h3><div class="box sc"><table>${L.map(s=>`<tr><td>N°${s.no}</td><td>${esc(s.client)}<br><span class=sm>${esc(sname(s))}</span></td><td>${dh(s.total)}</td><td><button class=btn onclick="showInv(D.sales.find(x=>x.id=='${s.id}'))">🧾</button> <button class="btn r" onclick="delSale('${s.id}')">🗑</button></td></tr>`).join('')}</table></div>`}
function delSale(id){const sl=D.sales.find(x=>x.id==id);ask(t('sure'),async()=>{if(sl)for(const l of sl.lines)if(l.id)await adj(l.id,l.u=='kg'?l.q/1000:l.q);await rm('sales',id);r()})}
function xl(){const{L,g,sv}=repData(),w=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(Object.keys(g).sort().map(d=>({Date:d,Ventes:g[d].n,Total:g[d].t,Benefice:g[d].b}))),'Par jour');
 XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(L.flatMap(s=>s.lines.map(l=>({Date:s.day,Facture:s.no,Client:s.client,Article:l.n,Qte:l.q,Unite:l.u=='kg'?'g':'pc',PU:l.p,Revient:l.c,Total:ll(l),Benefice:ll(l)-lc(l),Vendeur:sname(s)})))),'Detail');
 XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(Object.values(sv).map(v=>({Vendeur:v.name,Ventes:v.n,Chiffre_affaires:v.t,Benefice:v.b}))),'Vendeurs');XLSX.writeFile(w,`rapport_${S.from}_${S.to}.xlsx`)}

/* ---------- Utilisateurs (admin) ---------- */
function usrView(){return `<h2>👥 ${t('users')}</h2><div class=box><input id=nn placeholder="${t('full')}"><input id=nu placeholder="${t('user')}" autocapitalize=off><input id=np type=password placeholder="${t('pass')}">
 <select id=nr><option value=seller>${t('seller')}</option><option value=admin>${t('admin')}</option></select><button class="btn p" onclick="addUser()">➕ ${t('add')}</button></div>
 <div class=box><table>${D.users.map(u=>`<tr><td>${esc(u.name)}<br><span class=sm>${esc(u.username)}</span></td><td>${t(u.role=='admin'?'admin':'seller')}</td><td>${u.id==S.user.id?'':`<button class="btn r" onclick="delUser('${u.id}')">🗑</button>`}</td></tr>`).join('')}</table></div>`}
async function addUser(){const u=$('nu').value.trim().toLowerCase(),p=$('np').value;if(!u||p.length<4||D.users.some(x=>x.username==u))return alert('?');
 await put('users',{username:u,name:$('nn').value||u,role:$('nr').value,hash:await hash(p)});r()}
function delUser(id){ask(t('sure'),async()=>{await rm('users',id);r()})}

/* ---------- Stock ---------- */
async function adj(id,d,force){const i=D.items.find(x=>x.id==id);if(!i||(!force&&typeof i.stock!='number'))return;i.stock=Math.round(((i.stock||0)+d)*1000)/1000;
 if(useFB)await db.collection('items').doc(id).update({stock:firebase.firestore.FieldValue.increment(d)});else localStorage.b_items=JSON.stringify(D.items)}
async function patch(id,o){const i=D.items.find(x=>x.id==id);Object.assign(i,o);if(useFB)await db.collection('items').doc(id).update(o);else localStorage.b_items=JSON.stringify(D.items)}
async function setStock(id,v){if(v==='')return;await patch(id,{stock:+v});toast('✔')}
async function setMin(id,v){await patch(id,{min:+v||0});toast('✔')}
async function addStock(id){const v=+$('ad'+id).value;if(!v)return;await adj(id,v,true);toast('✔ +'+v);r()}
function stkView(){const q=(S.sq||'').toLowerCase(),c=S.sc||'',u=i=>isKg(i)?'kg':t('pcs');
 const L=D.items.filter(i=>(!c||i.cat==c)&&i.name.toLowerCase().includes(q)).sort((a,b)=>a.cat==b.cat?a.name.localeCompare(b.name):a.cat<b.cat?-1:1);
 return `<h2>📦 ${t('stock')}</h2><div class=row><select onchange="S.sc=this.value;r()"><option value="">${t('all')}</option>${CATS.map(x=>`<option value="${x.id}" ${c==x.id?'selected':''}>${lab(x)}</option>`).join('')}</select><input placeholder="🔍" value="${esc(S.sq||'')}" onchange="S.sq=this.value;r()"></div>
 <div class="box sc"><table><tr><th>${t('name')}</th><th>${t('stock')}</th><th>${t('add')}</th><th>Min</th></tr>
 ${L.map(i=>{const tr=typeof i.stock=='number',low=tr&&i.stock<=(i.min||0);return `<tr><td>${i.img?`<img src="${i.img}" style="width:34px;height:34px;object-fit:cover;border-radius:6px;vertical-align:middle"> `:''}${esc(i.name)}<br><span class=sm>${lab(CATS.find(x=>x.id==i.cat))}</span></td>
 <td><input style="width:84px;${low?'border-color:var(--r);color:var(--r)':''}" type=number step=any inputmode=decimal value="${tr?i.stock:''}" placeholder="—" onchange="setStock('${i.id}',this.value)"> ${u(i)}</td>
 <td><input style="width:70px" type=number step=any inputmode=decimal id="ad${i.id}" placeholder="+"><button class=btn onclick="addStock('${i.id}')">➕</button></td>
 <td><input style="width:60px" type=number step=any value="${i.min||''}" onchange="setMin('${i.id}',this.value)"></td></tr>`}).join('')||`<tr><td class=sm>${t('empty')}</td></tr>`}</table></div>`}
let rt;function listen(){if(!useFB)return;['items','sales','users'].forEach(c=>db.collection(c).onSnapshot(sn=>{D[c]=sn.docs.map(d=>d.data());clearTimeout(rt);rt=setTimeout(()=>{const a=document.activeElement;if(S.user&&!document.querySelector('.modal')&&!(a&&a.tagName=='INPUT'))r()},400)}))}
/* ---------- Rendu ---------- */
function r(){const y=scrollY;document.documentElement.dir=S.lang=='ar'?'rtl':'ltr';document.documentElement.lang=S.lang=='ar'?'ar':'fr';
 if(!D.users.length)return $('app').innerHTML=authBox(true);if(!S.user)return $('app').innerHTML=authBox(false);
 if(!['cat','home'].includes(S.view)&&!isA())S.view='home';
 $('app').innerHTML=hdr()+'<main>'+({home:homeView,cat:catView,stk:stkView,rep:repView,usr:usrView}[S.view])()+'</main>'+(S.cartOpen?cartPanel():'');scrollTo(0,y)}
(async()=>{try{if(useFB){firebase.initializeApp(FB);db=firebase.firestore();try{await firebase.auth().signInAnonymously()}catch(e){console.warn(e)}}
 await loadAll();listen();if('serviceWorker' in navigator&&(location.protocol=='https:'||location.hostname=='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});const id=sessionStorage.b_sess;S.user=D.users.find(u=>u.id==id)||null}catch(e){alert('Firebase: '+e.message)}r()})();
</script></body></html>
