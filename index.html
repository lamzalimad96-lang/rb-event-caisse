 open(){return new Promise((res,rej)=>{if(this.db)return res();if(!window.indexedDB)return rej(Error('IndexedDB'));const q=indexedDB.open('rbevent',1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps')};q.onsuccess=()=>{this.db=q.result;res()};q.onerror=()=>rej(q.error)})},
 req(st,mode,fn){return new Promise((res,rej)=>{const tx=this.db.transaction(st,mode),r=fn(tx.objectStore(st));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})},
 get(st,k){return this.req(st,'readonly',s=>s.get(k))},set(st,k,v){return this.req(st,'readwrite',s=>s.put(v,k))},
 del(st,k){return this.req(st,'readwrite',s=>s.delete(k))},keys(st){return this.req(st,'readonly',s=>s.getAllKeys())}};
async function saveLocal(c){if(IDB.db){try{await IDB.set('kv',c,D[c]);return}catch(e){console.warn(e)}}
 try{localStorage['b_'+c]=JSON.stringify(D[c])}catch(e){toast('⚠ '+L('Stockage plein : faites une sauvegarde','الذاكرة عامرة'),5000)}}
async function put(c,o){o.id=o.id||uid();const i=D[c].findIndex(x=>x.id==o.id);i<0?D[c].push(o):D[c][i]=o;
 if(useFB)await db.collection(c).doc(o.id).set(JSON.parse(JSON.stringify(o)));else await saveLocal(c);dirty();return o}
async function rm(c,id){D[c]=D[c].filter(x=>x.id!=id);
 if(useFB)await db.collection(c).doc(id).delete();else await saveLocal(c);dirty()}
async function loadAll(){
 if(useFB){for(const c of COLS){const s=await db.collection(c).get();D[c]=s.docs.map(d=>d.data())}return}
 try{await IDB.open()}catch(e){console.warn(e)}
 for(const c of COLS){let v;if(IDB.db){try{v=await IDB.get('kv',c)}catch(e){}}
  if(v==null&&localStorage['b_'+c]){try{v=JSON.parse(localStorage['b_'+c])}catch(e){v=[]}if(IDB.db)await IDB.set('kv',c,v)}
  D[c]=Array.isArray(v)?v:[]}}
async function adj(id,d,force){const i=itemOf(id);if(!i||(!force&&typeof i.stock!='number'))return;i.stock=Math.round(((i.stock||0)+d)*1000)/1000;
 if(useFB)await db.collection('items').doc(id).update({stock:typeof i.stock=='number'&&!force?firebase.firestore.FieldValue.increment(d):i.stock});else await saveLocal('items');dirty()}
async function patch(id,o){const i=itemOf(id);Object.assign(i,o);if(useFB)await db.collection('items').doc(id).update(o);else await saveLocal('items');dirty()}
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bq1'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(p)}}
function shrink(f){return new Promise(res=>{const fb=()=>{if(f.size>900000){alert('Photo trop lourde / الصورة كبيرة بزاف');return res('')}const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=()=>res('');r.readAsDataURL(f)};
 try{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const k=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.65))}catch(e){fb()}};im.onerror=fb;im.src=u}catch(e){fb()}})}
function loadLib(url,ok){return ok()?Promise.resolve():new Promise((res,rej)=>{const e=document.createElement('script');e.src=url;e.onload=()=>ok()?res():rej(Error('lib'));e.onerror=()=>rej(Error(L('Connexion internet requise','خاص الانترنيت')));document.head.appendChild(e)})}

let dirtyT;function dirty(){S.dirty=true;clearTimeout(dirtyT);dirtyT=setTimeout(()=>snap(),20000)}
function dump(){const o={app:'RB EVENT',v:2,date:new Date().toISOString(),shop:shop()};COLS.forEach(c=>o[c]=D[c]);return o}
async function snap(key){try{await IDB.open();await IDB.set('snaps',key||today(),dump());S.dirty=false;localStorage.b_lastsnap=new Date().toISOString();
 const ks=(await IDB.keys('snaps')).filter(k=>/^\d{4}-\d\d-\d\d$/.test(k)).sort();while(ks.length>14)await IDB.del('snaps',ks.shift())}catch(e){console.warn('snap',e)}}
function dl(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000)}
const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const enc=v=>v!==null&&typeof v=='object'?'§J'+JSON.stringify(v):v;
const dec=v=>{if(typeof v=='string'&&v.startsWith('§J')){try{return JSON.parse(v.slice(2))}catch(e){}}return v};
function wbFrom(o){const w=XLSX.utils.book_new(),big=[];
 XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet([{app:'RB EVENT',v:2,date:o.date||new Date().toISOString(),shop:o.shop||''}]),'Info');
 COLS.forEach(c=>{const rows=(o[c]||[]).map(x=>{const y={};for(const k in x){const v=enc(x[k]);if(v===undefined||v===null)continue;
   if(typeof v=='string'&&v.length>30000){for(let i=0,n=0;i<v.length;i+=30000,n++)big.push({c,id:x.id,k,n,data:v.slice(i,i+30000)})}else y[k]=v}return y});
  if(rows.length)XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(rows),c)});
 if(big.length)XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(big),'Gros_champs');return w}
async function xlsxDl(o,name){try{await loadLib(XLURL,()=>window.XLSX)}catch(e){toast(e.message,3000);return false}
 dl(new Blob([XLSX.write(wbFrom(o),{type:'array',bookType:'xlsx'})],{type:XLSX_MIME}),name);return true}
async function backupFile(auto){const name=`rbevent_sauvegarde_${today()}.xlsx`;if(!await xlsxDl(dump(),name))return;localStorage.b_lastfile=new Date().toISOString();
 if(!auto)toast('✔ '+name,2500);else toast('💾 '+L('Sauvegarde automatique téléchargée (Excel)','تحملات النسخة (Excel)'),2500)}
async function fromWB(buf){await loadLib(XLURL,()=>window.XLSX);const w=XLSX.read(buf,{type:'array'}),o={},rd=n=>w.Sheets[n]?XLSX.utils.sheet_to_json(w.Sheets[n],{defval:null}):null;
 const info=(rd('Info')||[])[0];if(!info||info.app!='RB EVENT')throw Error('bad');o.date=info.date;o.shop=info.shop;
 COLS.forEach(c=>{const rows=rd(c);if(rows)o[c]=rows.map(r=>{const y={};for(const k in r){if(r[k]===null||r[k]==='')continue;y[k]=dec(r[k])}return y});else if(c!='users')o[c]=[]});
 const big={};(rd('Gros_champs')||[]).forEach(b=>{const key=b.c+'|'+b.id+'|'+b.k;(big[key]=big[key]||[])[b.n]=b.data});
 for(const key in big){const[c,id,k]=key.split('|'),x=(o[c]||[]).find(z=>String(z.id)==id);if(x)x[k]=dec(big[key].join(''))}
 return o}
async function restoreFile(el){const f=el.files[0];el.value='';if(!f)return;try{
 if(/\.xlsx?$/i.test(f.name))restoreData(await fromWB(await f.arrayBuffer()));else restoreData(JSON.parse(await f.text()))}catch(e){toast(L('Fichier invalide','ملف غالط'),3000)}}
async function snapRestore(k){await IDB.open();restoreData(await IDB.get('snaps',k))}
async function snapDl(k){await IDB.open();const o=await IDB.get('snaps',k);if(o)xlsxDl(o,`rbevent_${k}.xlsx`)}
function restoreData(o){if(!o||!Array.isArray(o.items)||!Array.isArray(o.sales))return toast(L('Fichier invalide','ملف غالط'),3000);
 ask(L('Remplacer TOUTES les données actuelles par cette sauvegarde du ','تبدل جميع البيانات بالنسخة ديال ')+fdt(o.date||Date.now())+' ?',async()=>{toast('⏳ …',8000);await snap('avant-restauration');
  for(const c of COLS){const arr=Array.isArray(o[c])?o[c]:(c=='users'?D.users:[]);
   if(useFB){const nw=new Set(arr.map(x=>x.id));let b=db.batch(),n=0;const fl=async()=>{if(n){await b.commit();b=db.batch();n=0}};
    for(const x of D[c])if(!nw.has(x.id)){b.delete(db.collection(c).doc(x.id));if(++n>=400)await fl()}
    for(const x of arr){b.set(db.collection(c).doc(x.id),JSON.parse(JSON.stringify(x)));if(++n>=400)await fl()}await fl()}
   D[c]=arr;if(!useFB)await saveLocal(c)}
  if(o.shop)localStorage.b_shop=o.shop;
  if(!D.users.some(u=>u.id==S.user.id)){logout();return}S.user=D.users.find(u=>u.id==S.user.id);toast('✔ '+L('Données restaurées','تم الاسترجاع'),3000);r()},L('Restaurer','رجّع'))}

function ean(d12){let s=0;for(let i=0;i<12;i++)s+=(+d12[i])*(i%2?3:1);return d12+((10-s%10)%10)}
function genCode(){let c;do{c=ean('20'+String(Date.now()).slice(-7)+String(Math.floor(Math.random()*1000)).padStart(3,'0'))}while(D.items.some(i=>i.code==c));return c}
function scanEnter(code,fromSearch){code=String(code||'').trim();if(!code)return;const i=D.items.find(x=>x.code&&x.code==code);
 if(i){beep();tap(i.id);if(fromSearch&&$('q')){$('q').value='';S.q='';$('grid').innerHTML=gridHTML()}return}
 if(fromSearch){const m=posItems();if(m.length==1){tap(m[0].id);$('q').value='';S.q='';$('grid').innerHTML=gridHTML()}return}
 toast('❓ '+L('Code inconnu','كود ما معروفش')+' : '+code,3000);
 if(isA())ask(L('Code inconnu','كود ما معروفش')+' <b>'+esc(code)+'</b>. '+L('Créer un article avec ce code ?','تزيد سلعة بهاد الكود؟'),()=>{openForm();S.draft.code=code;modal()},L('Créer','زيد'))}
let SCAN=null;
function stopScan(){const s=SCAN;SCAN=null;if(s){try{s.stop()}catch(e){}}closeM('scm')}
async function camScan(cb){stopScan();const m=modalEl(`<div class=box><div class=mh><h3>📷 ${L('Scanner un code-barres','سكاني الكود')}</h3><button class=x onclick="stopScan()">✕</button></div><div id=scv class=scv></div><p class="sm mut" style="text-align:center">${L('Placez le code-barres devant la caméra arrière','حط الكود قدام الكاميرا')}</p></div>`,'scm',85);m.dataset.lock=1;
 const done=c=>{stopScan();beep();cb(c)};
 try{let native=false;if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();native=f&&f.length>0}catch(e){}}
  if(native){const det=new BarcodeDetector(),st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=document.createElement('video');v.setAttribute('playsinline','');v.muted=true;v.srcObject=st;$('scv').appendChild(v);await v.play();
   let live=true;SCAN={stop:()=>{live=false;st.getTracks().forEach(x=>x.stop())}};const loop=async()=>{if(!live)return;try{const rs=await det.detect(v);if(rs.length&&live)return done(rs[0].rawValue)}catch(e){}setTimeout(loop,120)};loop()}
  else{await loadLib('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js',()=>window.Html5Qrcode);if(!$('scv'))return;const h=new Html5Qrcode('scv');let live=true;
   SCAN={stop:()=>{if(live){live=false;h.stop().then(()=>h.clear()).catch(()=>{})}}};
   await h.start({facingMode:'environment'},{fps:10,qrbox:(w,hh)=>({width:Math.floor(Math.min(320,w*.9)),height:Math.floor(Math.min(160,hh*.6))})},c=>{if(live)done(c)},()=>{})}
 }catch(e){stopScan();toast('📷 '+L('Caméra indisponible : ','الكاميرا ما خدامةش: ')+(e.message||e),4500)}}

V.sta=function(){const f=S.from,to=S.to,As=D.sales.filter(s=>inP(s,f,to)),R=D.returns.filter(x=>inP(x,f,to)),E=D.expenses.filter(x=>inP(x,f,to)),P=D.payments.filter(x=>inP(x,f,to)),Pu=D.purchases.filter(x=>inP(x,f,to));
 const ca=sum(As,'total'),ret=sum(R,'amount'),gp=sum(As,'profit')-sum(R,retImpact),ex=sum(E,'amount'),np=gp-ex,n=As.length,avg=n?ca/n:0,cr=sum(As,s=>s.total-spaid(s));
 const nd=dayDiff(f,to)+1,pf=addDays(f,-nd),pt=addDays(f,-1),Ap=D.sales.filter(s=>inP(s,pf,pt)),Rp=D.returns.filter(x=>inP(x,pf,pt)),Ep=D.expenses.filter(x=>inP(x,pf,pt));
 const cap=sum(Ap,'total'),npp=sum(Ap,'profit')-sum(Rp,retImpact)-sum(Ep,'amount'),avgp=Ap.length?cap/Ap.length:0;
 let ev=[];if(nd<=62){for(let d=f;d<=to;d=addDays(d,1))ev.push({l:d.slice(8),v:sum(As.filter(s=>s.day==d),'total'),tip:fday(d)})}
 else{let m=f.slice(0,7);while(m<=to.slice(0,7)){const mm=m;ev.push({l:mm.slice(5)+'/'+mm.slice(2,4),v:sum(As.filter(s=>s.day.slice(0,7)==mm),'total')});const[y,mo]=m.split('-').map(Number);m=mo==12?`${y+1}-01`:`${y}-${String(mo+1).padStart(2,'0')}`}}
 const byCat={},byPay={},hours=Array(24).fill(0),wd=Array(7).fill(0),prod={},cli={};
 As.forEach(s=>{const ratio=s.sub>0?s.total/s.sub:1,h=new Date(s.date).getHours();hours[h]+=s.total;wd[new Date(s.day+'T12:00:00').getDay()]+=s.total;byPay[spay(s)]=(byPay[spay(s)]||0)+s.total;
  if(s.client&&s.client!='-')cli[s.client]=(cli[s.client]||0)+s.total;
  s.lines.forEach(l=>{const c=l.cat||(itemOf(l.id)||{}).cat||'-';byCat[c]=(byCat[c]||0)+ll(l)*ratio;const p=prod[l.n]=prod[l.n]||{q:0,u:l.u,v:0,b:0};p.q+=l.q;p.v+=ll(l)*ratio;p.b+=ll(l)*ratio-lc(l)})});
 const WD=S.lang=='ar'?['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت']:['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
 const hmin=Math.min(...hours.map((v,i)=>v?i:24),9),hmax=Math.max(...hours.map((v,i)=>v?i:0),20);
 const tp=Object.entries(prod).sort((a,b)=>b[1].v-a[1].v).slice(0,10);
 return periodBar()+`<div class=kpis>${kpi(t('ca'),dh(ca),'',dlt(ca,cap))}${kpi(L('Retours','المرجوعات'),dh(ret),'bad')}${kpi(L('CA net','رقم المعاملات الصافي'),dh(ca-ret))}${kpi(L('Marge brute','الربح الخام'),dh(gp),'ok',`<small>${ca-ret>0?Math.round(gp/(ca-ret)*100)+'% '+L('de marge','هامش'):''}</small>`)}${kpi(L('Dépenses','المصاريف'),dh(ex),'bad')}${kpi(L('Bénéfice net','الربح الصافي'),dh(np),np>=0?'ok':'bad',dlt(np,npp))}${kpi(t('nb'),n,'',dlt(n,Ap.length))}${kpi(L('Panier moyen','متوسط السلة'),dh(avg),'',dlt(avg,avgp))}${kpi(L('Crédits accordés','الكريدي اللي تعطى'),dh(cr),'warn')}${kpi(L('Crédits encaissés','الكريدي اللي تخلص'),dh(sum(P,'amount')),'ok')}${kpi(L('Achats fournisseurs','المشتريات'),dh(sum(Pu,'total')))}${kpi(L('Valeur du stock','قيمة المخزون'),dh(sum(D.items,i=>typeof i.stock=='number'&&i.stock>0?i.stock*i.cost:0)))}</div>
 <div class=card><h3>📈 ${L('Évolution du chiffre d\'affaires','تطور رقم المعاملات')}</h3>${vbars(ev)}</div>
 <div class=cols2><div class=card><h3>🗂 ${L('Ventes par catégorie','المبيعات حسب الصنف')}</h3>${hbars(Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const c=CATS.find(x=>x.id==k);return{l:c?EM[c.id]+' '+lab(c):'-',v}}))}</div>
 <div class=card><h3>💳 ${L('Modes de paiement','طرق الأداء')}</h3>${hbars(Object.entries(byPay).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({l:payLab(k),v})))}</div>
 <div class=card><h3>🕐 ${L('Ventes par heure','المبيعات حسب الساعة')}</h3>${vbars(hours.slice(hmin,hmax+1).map((v,i)=>({l:(hmin+i)+'h',v})))}</div>
 <div class=card><h3>📅 ${L('Ventes par jour de la semaine','حسب أيام الأسبوع')}</h3>${vbars([1,2,3,4,5,6,0].map(i=>({l:WD[i],v:wd[i]})))}</div></div>
 <div class=cols2><div class="card sc"><h3>🏆 ${L('Top 10 articles','أحسن 10 سلع')}</h3><table class=tbl><thead><tr><th>${t('name')}</th><th>${t('qty')}</th><th>${t('ca')}</th><th>${t('profit')}</th></tr></thead><tbody>${tp.map(([k,p])=>`<tr><td>${esc(k)}</td><td>${p.u=='kg'?(r2(p.q/1000))+' kg':p.q}</td><td><b>${dh(p.v)}</b></td><td class=ok>${dh(p.b)}</td></tr>`).join('')||`<tr><td colspan=4 class=empty>${t('empty')}</td></tr>`}</tbody></table></div>
 <div class=card><h3>⭐ ${L('Meilleurs clients','أحسن الكليان')}</h3>${hbars(Object.entries(cli).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([l,v])=>({l,v})))}<h3 style="margin-top:18px">🧑‍💼 ${t('perf')}</h3>${hbars(Object.values(repSel(As)).sort((a,b)=>b.v-a.v).map(x=>({l:x.l,v:x.v})))}</div></div>`};

async function printLabels(){const n=Math.max(1,Math.min(200,num($('lbn').value)||1)),sp=$('lbp').checked;try{await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js',()=>window.JsBarcode)}catch(e){return toast(e.message,3000)}
 const its=S.lbl.map(itemOf).filter(Boolean);for(const i of its)if(!i.code)await patch(i.id,{code:genCode()});
 const box=document.createElement('div');box.setAttribute('data-a4','');box.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;font-family:Arial,sans-serif';
 its.forEach(i=>{for(let k=0;k<n;k++){const d=document.createElement('div');d.style.cssText='border:1px dashed #999;border-radius:6px;padding:3mm;text-align:center;page-break-inside:avoid;break-inside:avoid;color:#000';
  d.innerHTML=`<div style="font-size:10px;font-weight:700;color:#1565c0">${esc(shop())}</div><div style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.name)}</div>`;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');const ok13=/^\d{13}$/.test(i.code)&&ean(i.code.slice(0,12))==i.code;try{JsBarcode(svg,i.code,{format:ok13?'EAN13':'CODE128',width:1.6,height:42,fontSize:13,margin:0})}catch(e){JsBarcode(svg,i.code,{format:'CODE128',width:1.6,height:42,fontSize:13,margin:0})}
  svg.style.maxWidth='100%';d.appendChild(svg);if(sp)d.insertAdjacentHTML('beforeend',`<div style="font-size:15px;font-weight:800">${dh(i.price)}${sfx(i)}</div>`);box.appendChild(d)}});
 closeM('lbm');const w=document.createElement('div');w.appendChild(box);printHTML(w.innerHTML);r()}

V.usr=function(){return `<div class=card><h3>➕ ${L('Créer un compte','زيد حساب')}</h3><div class=row><div><label>${t('full')}</label><input id=nn></div><div><label>${t('user')}</label><input id=nu autocapitalize=off></div></div><div class=row><div><label>${t('pass')} (4+)</label><input id=np type=password></div><div><label>${t('role')}</label><select id=nr><option value=seller>${t('seller')}</option><option value=admin>${t('admin')}</option></select></div><button class="btn p" style="flex:0 0 auto;margin-bottom:4px" onclick="addUser()">➕ ${t('add')}</button></div><p class="sm mut">🔒 ${L("Seul l'administrateur peut créer des comptes. La page de connexion ne permet plus d'en créer.",'غير الأدمن اللي يقدر يزيد الحسابات.')}</p></div>
 <div class="card sc" style="padding:6px 10px"><table class=tbl><thead><tr><th>${t('name')}</th><th>${t('role')}</th><th>${t('nb')}</th><th></th></tr></thead><tbody>${D.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="sm mut">${esc(u.username)}</span>${u.mustChange?` <span class="badge warn">${L('mot de passe initial','كلمة سر أولية')}</span>`:''}</td><td><span class="badge ${u.role=='admin'?'':'ok'}">${t(u.role=='admin'?'admin':'seller')}</span></td><td>${D.sales.filter(s=>s.user==u.username).length}</td><td class=act><button class=ib onclick="userEdit('${u.id}')">✏️</button>${u.id==S.user.id?'':`<button class="ib dng" onclick="delUser('${u.id}')">🗑</button>`}</td></tr>`).join('')}</tbody></table></div>
 <button class=btn onclick="pwdModal()">🔑 ${L('Changer mon mot de passe','بدّل كلمة السر ديالي')}</button>`};
async function addUser(){const u=$('nu').value.trim().toLowerCase(),p=$('np').value;if(!u)return toast(L('Identifiant obligatoire','اسم المستخدم ضروري'));if(p.length<4)return toast(L('Mot de passe : 4 caractères minimum','كلمة السر 4 حروف على الأقل'));if(D.users.some(x=>x.username==u))return toast(L('Identifiant déjà utilisé','مستعمل'));
 await put('users',{username:u,name:$('nn').value.trim()||u,role:$('nr').value,hash:await hash(p)});toast('✔ '+u);r()}
function userEdit(id){const u=D.users.find(x=>x.id==id);modalEl(`<div class=box><div class=mh><h3>✏️ ${esc(u.username)}</h3><button class=x onclick="closeM('uem')">✕</button></div><label>${t('full')}</label><input id=ue1 value="${esc(u.name)}"><label>${t('role')}</label><select id=ue2 ${u.id==S.user.id?'disabled':''}><option value=seller ${u.role!='admin'?'selected':''}>${t('seller')}</option><option value=admin ${u.role=='admin'?'selected':''}>${t('admin')}</option></select><label>${L('Nouveau mot de passe (laisser vide pour ne pas changer)','كلمة سر جديدة (خليها خاوية)')}</label><input id=ue3 type=password>
 <div class=row style="margin-top:10px"><button class=btn onclick="closeM('uem')">${t('cancel')}</button><button class="btn p" onclick="saveUser('${id}')">💾 ${t('save')}</button></div></div>`,'uem',75)}
async function saveUser(id){const u=D.users.find(x=>x.id==id),p=$('ue3').value;if(p&&p.length<4)return toast('4+');u.name=$('ue1').value.trim()||u.username;if(u.id!=S.user.id)u.role=$('ue2').value;if(p){u.hash=await hash(p);u.mustChange=true}
 if(!D.users.some(x=>x.role=='admin'))return toast(L('Il faut au moins un administrateur','خاص أدمن واحد على الأقل'));await put('users',u);if(u.id==S.user.id)S.user=u;closeM('uem');toast('✔');r()}
function delUser(id){const u=D.users.find(x=>x.id==id);if(u.role=='admin'&&D.users.filter(x=>x.role=='admin').length<2)return toast(L('Impossible : dernier administrateur','ما يمكنش'));ask(t('sure')+' '+esc(u.name),async()=>{await rm('users',id);r()})}

 <p class="sm mut">${L('Espace utilisé','المساحة المستعملة')} : <span id=stor>…</span> · ${useFB?'☁️ Firebase':'📱 '+L('Données locales (cet appareil)','بيانات محلية')}</p></div>

 <div class=card><h3>⌨️ ${L('Raccourcis','اختصارات')}</h3>

async function loadSnaps(){const el=$('snaps');if(!el)return;try{await IDB.open();const ks=(await IDB.keys('snaps')).sort().reverse();
 el.innerHTML=ks.length?`<table class=tbl><tbody>${ks.map(k=>`<tr><td><b>${/^\d{4}/.test(k)?fday(k):'⏪ '+L('Avant restauration','قبل الاسترجاع')}</b></td><td class=act><button class=ib onclick="snapDl('${k}')">⬇</button><button class="btn sm" onclick="snapRestore('${k}')">⟲ ${L('Restaurer','رجّع')}</button></td></tr>`).join('')}</tbody></table>`:`<p class=mut>${t('empty')}</p>`}catch(e){el.textContent='IndexedDB indisponible'}
 try{const q=await navigator.storage.estimate(),e2=$('stor');if(e2)e2.textContent=`${(q.usage/1048576).toFixed(1)} Mo / ${(q.quota/1048576).toFixed(0)} Mo`}catch(e){}}

 clearTimeout(rt);rt=setTimeout(()=>{const a=document.activeElement,typing=a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)&&!['scan','q'].includes(a.id);if(S.user&&!document.querySelector('.modal')&&!typing)r()},400)}))}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.dirty)snap()});
(async()=>{try{
 if(useFB){const G='https://www.gstatic.com/firebasejs/10.12.2/';await loadLib(G+'firebase-app-compat.js',()=>window.firebase);await loadLib(G+'firebase-auth-compat.js',()=>firebase.auth);await loadLib(G+'firebase-firestore-compat.js',()=>firebase.firestore);
  firebase.initializeApp(FB);db=firebase.firestore();try{await db.enablePersistence({synchronizeTabs:true})}catch(e){}try{await firebase.auth().signInAnonymously()}catch(e){console.warn(e)}}

 const id=sessionStorage.b_sess,u=D.users.find(x=>x.id==id);S.user=u&&!u.mustChange?u:null;if(S.user)S.view=isA()?'dash':'pos';

}catch(e){alert('Erreur : '+e.message)}r()})();
