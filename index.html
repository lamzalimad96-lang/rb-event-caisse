<style>
:root{--bg:#eef2f8;--card:#fff;--ink:#0f1d33;--mut:#66788f;--pri:#1565c0;--pri2:#0b3d91;--pri-s:#e8f0fd;--line:#e2e8f1;--ok:#15803d;--ok-s:#e7f6ec;--bad:#d32f2f;--bad-s:#fdecec;--warn:#b45309;--warn-s:#fff4e0;--rad:14px;--sh:0 1px 2px rgba(15,29,51,.05),0 6px 18px rgba(15,29,51,.06);--rail:226px;--cartw:390px}
[data-theme=dark]{--bg:#0c1423;--card:#141f37;--ink:#e6edf7;--mut:#93a4bd;--pri:#4f8ff0;--pri2:#2f6fd6;--pri-s:#1b2d4f;--line:#25365a;--ok:#4ade80;--ok-s:#10331f;--bad:#f87171;--bad-s:#3a1717;--warn:#fbbf24;--warn-s:#3a2c0d;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Arabic",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}a{color:var(--pri)}
h2{margin:0 0 12px;font-size:21px}h3{font-size:16px}
/* ---- layout ---- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--cartw);height:100vh;height:100dvh}
.rail{background:linear-gradient(180deg,#0b3d91,#082a63);color:#fff;display:flex;flex-direction:column;overflow-y:auto;padding:14px 10px;padding-top:max(14px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 16px;cursor:pointer}
.brand img{width:46px;height:46px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.25)}

.nav{display:flex;flex-direction:column;gap:2px;flex:1}

.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button.on{background:#fff;color:#0b3d91;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.nav .ic{width:24px;text-align:center;font-size:18px;flex:0 0 24px}
.nav .bdg{margin-inline-start:auto;background:#ef4444;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;font-weight:700}
.me{border-top:1px solid rgba(255,255,255,.15);padding:12px 4px 2px;margin-top:10px;font-size:13px;display:flex;align-items:center;gap:8px}
.me .av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:700;flex:0 0 36px}
.me .tx{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.me .tx b{overflow:hidden;text-overflow:ellipsis}.me .lo{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:9px;padding:7px 10px;cursor:pointer}
.mid{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line);min-height:60px}
.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.ib{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;cursor:pointer;font-size:14px;white-space:nowrap;line-height:1.2}
.ib:hover{border-color:var(--pri)}.ib.on{background:var(--pri);color:#fff;border-color:var(--pri)}.ib.dng{color:var(--bad)}
.mo{display:none}
/* ---- éléments ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:11px;cursor:pointer;font-size:14px;font-weight:600;transition:.12s;white-space:nowrap}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}.btn.p:hover{background:var(--pri2)}
.btn.r{color:var(--bad);border-color:var(--bad)}.btn.r:hover{background:var(--bad-s)}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}.btn.big{padding:14px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:15px;margin:4px 0;outline:none;transition:border-color .12s,box-shadow .12s}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-s)}
input:disabled{opacity:.6}
label{font-size:12.5px;color:var(--mut);font-weight:600;display:block;margin-top:6px}
label.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:500;cursor:pointer;margin:10px 0;font-size:14px}
label.chk input{width:18px;height:18px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px;margin:0 0 14px;box-shadow:var(--sh)}
.card>h3:first-child{margin:0 0 12px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.row>*{flex:1;min-width:0}
.bar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}.bar>input,.bar>select,.bar>div{flex:1;min-width:150px}.bar>.btn,.bar>label.btn,.bar>.badge{flex:0 0 auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:13px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--pri)}
.kpi.ok::before{background:var(--ok)}.kpi.bad::before{background:var(--bad)}.kpi.warn::before{background:var(--warn)}
.kpi span{font-size:12.5px;color:var(--mut);font-weight:600}.kpi b{display:block;font-size:20px;margin-top:4px}
.kpi.ok b{color:var(--ok)}.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi small{font-size:12px;color:var(--mut)}
.kpi em{font-style:normal;font-size:12px;font-weight:700;display:block;margin-top:2px}.up{color:var(--ok)}.dn{color:var(--bad)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);text-align:start;padding:9px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tbody tr:hover td{background:var(--pri-s)}
.act{white-space:nowrap;text-align:end}.act>*{margin-inline-start:4px}
.sc{overflow-x:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;background:var(--pri-s);color:var(--pri);white-space:nowrap}
.badge.ok{background:var(--ok-s);color:var(--ok)}.badge.bad{background:var(--bad-s);color:var(--bad)}.badge.warn{background:var(--warn-s);color:var(--warn)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--mut)}.sm{font-size:12.5px}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:15px;line-height:1.7}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:30px;padding:8px 15px;cursor:pointer;font-weight:600;font-size:14px;box-shadow:var(--sh)}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.chips.sub button{padding:6px 12px;font-size:13px;box-shadow:none}.chips.sub button.on{background:var(--pri-s);color:var(--pri);border-color:var(--pri)}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:14px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:9px;cursor:pointer;font-weight:600;white-space:nowrap}.tabs button.on{background:var(--pri);color:#fff}
.alert{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:12px;background:var(--warn-s);color:var(--warn);margin-bottom:10px;font-weight:600;font-size:14px;flex-wrap:wrap}
.alert.bad{background:var(--bad-s);color:var(--bad)}.alert>span{flex:1;min-width:180px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:14px}.cols2>.card{margin:0}
/* ---- caisse ---- */
.posbar{display:flex;gap:8px;margin-bottom:12px}.posbar .srch{flex:1}.posbar input{margin:0;padding:12px 14px;font-size:16px;border-radius:12px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;cursor:pointer;box-shadow:var(--sh);transition:transform .08s,box-shadow .15s;display:flex;flex-direction:column;user-select:none}
.pc:hover{box-shadow:0 8px 24px rgba(21,101,192,.18);border-color:var(--pri)}.pc:active{transform:scale(.96)}
.pc .im{aspect-ratio:1/1;background:var(--pri-s);display:grid;place-items:center;font-size:42px;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.pc .nm{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pc .pr{color:var(--pri);font-weight:800;font-size:15px}
.pc .st{position:absolute;top:8px;inset-inline-start:8px;background:rgba(255,255,255,.94);color:#15803d;border-radius:20px;padding:2px 8px;font-size:11.5px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pc .st.warn{color:#b45309}.pc .st.bad{background:#d32f2f;color:#fff}
.pc .adm{position:absolute;top:6px;inset-inline-end:6px;display:flex;gap:4px}
.pc .adm span{background:rgba(255,255,255,.95);border-radius:8px;padding:4px 7px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;cursor:pointer;font-size:14px;font-weight:600;box-shadow:var(--sh);transition:.12s}
.tile:hover{border-color:var(--pri);transform:translateY(-2px)}.tile span{display:block;font-size:32px;margin-bottom:4px}
/* ---- panier ---- */
.cart{background:var(--card);border-inline-start:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow:hidden}
.cbar{display:none;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;background:var(--pri);color:#fff}
.cbar .big2{font-size:18px}
.pill{background:var(--pri);color:#fff;border-radius:20px;font-size:12px;font-weight:700;padding:2px 9px;min-width:24px;text-align:center}.cbar .pill{background:#fff;color:var(--pri)}
.cbody{display:flex;flex-direction:column;flex:1;min-height:0}
.chd{display:flex;align-items:center;gap:8px;padding:14px 14px 10px;padding-top:max(14px,env(safe-area-inset-top))}
.cscan{display:flex;gap:6px;padding:0 12px 8px}.cscan input{margin:0;font-size:14px;padding:9px 12px}
.clines{flex:1;overflow-y:auto;padding:0 12px;min-height:110px}
.cl{display:grid;grid-template-columns:1fr auto auto;grid-template-areas:"n t r" "q q r";gap:6px 8px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.cl .cn{grid-area:n;min-width:0}.cl .cn b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl .ct{grid-area:t;font-weight:800;color:var(--pri);white-space:nowrap}
.cl .rm{grid-area:r;align-self:start;color:var(--bad);padding:3px 8px}
.cl .qc{grid-area:q}
.qc{display:flex;align-items:center;gap:4px}
.qc button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;font-weight:700;flex:0 0 34px}
.qc input{width:74px;margin:0;padding:6px;text-align:center}
.pin{width:80px!important;padding:3px 6px!important;margin:2px 0!important;font-size:13px!important;display:inline-block}
.cfoot{border-top:1px solid var(--line);padding:10px 12px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom));overflow-y:auto;max-height:64%}
.frow{display:flex;align-items:center;gap:6px}.frow>label{margin:0;width:24px;text-align:center;font-size:16px;flex:0 0 24px}.frow input,.frow select{margin:3px 0;padding:8px 10px;font-size:14px}
.tots{margin:8px 0;padding:10px 12px;background:var(--bg);border-radius:12px}
.tots div{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}
.tots .grand{font-size:25px;font-weight:800;color:var(--pri);border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 2px;cursor:pointer;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:1px}
.seg button small{font-size:11px;font-weight:600}.seg button.on{border-color:var(--pri);background:var(--pri-s);color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.quick{display:flex;gap:4px;margin:3px 0}.quick .ib{flex:1;padding:6px 4px;font-size:13px}
.chg{font-weight:700;padding:5px 4px;font-size:15px}
.btn.pay{width:100%;padding:15px;font-size:18px;border-radius:14px;margin-top:6px;box-shadow:0 6px 16px rgba(21,101,192,.32)}
/* ---- graphiques ---- */
.vb{display:flex;gap:4px;align-items:flex-end;height:170px;padding-top:6px}
.vb>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center;font-size:10.5px;color:var(--mut);min-width:0}
.vb i{display:block;background:linear-gradient(180deg,var(--pri),var(--pri2));border-radius:5px 5px 2px 2px;min-height:2px}
.vb span{white-space:nowrap;overflow:hidden;margin-top:3px}
.hb{display:flex;flex-direction:column;gap:9px}
.hb>div{display:grid;grid-template-columns:minmax(80px,32%) 1fr auto;gap:8px;align-items:center;font-size:13px}
.hb .tr{background:var(--bg);border-radius:6px;height:12px;overflow:hidden}.hb .tr i{display:block;height:100%;background:var(--pri);border-radius:6px}
.hb b{white-space:nowrap;font-size:13px}
.den{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin:8px 0}
.den>div{display:flex;align-items:center;gap:6px;background:var(--bg);border-radius:10px;padding:6px 8px}
.den b{min-width:52px;font-size:13px}.den input{margin:0;padding:6px;width:64px}.den small{margin-inline-start:auto;color:var(--mut);font-size:11.5px;white-space:nowrap}
/* ---- modales ---- */
.modal{position:fixed;inset:0;background:rgba(8,18,38,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;z-index:60;padding:12px;animation:fd .15s}
.modal .box{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:440px;max-height:92vh;max-height:92dvh;overflow:auto;box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .18s}
@keyframes pop{from{transform:scale(.96);opacity:0}}@keyframes fd{from{opacity:0}}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.mh h3{flex:1;margin:0}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;flex:0 0 34px}
.pvimg{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-bottom:8px;display:block}
.fl{position:relative;overflow:hidden}.fl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;margin:0;padding:0;font-size:0}
.scv{width:100%;min-height:260px;background:#000;border-radius:12px;overflow:hidden}.scv video{width:100%;display:block}
.docv{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;overflow:auto;color:#000}

.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 15% 10%,#3b82f6 0,transparent 45%),radial-gradient(circle at 90% 90%,#0ea5e9 0,transparent 40%),linear-gradient(135deg,#0b3d91,#1565c0)}
.lbox{width:100%;max-width:380px;text-align:center;background:var(--card);border-radius:24px;padding:30px 22px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.lbox h2{margin:12px 0 4px}.lbox input{padding:13px 14px}
.llogo{width:112px;height:112px;border-radius:50%;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.nov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}.nov.on{display:block}
#inv{display:none}
/* ---- responsive ---- */
@media(max-width:1200px){:root{--rail:74px;--cartw:350px}.rail .tx,.brand b{display:none}.nav button{justify-content:center;padding:11px 0}.nav .bdg{position:absolute;top:2px;inset-inline-end:4px;padding:0 5px}.brand{justify-content:center}.me{flex-direction:column}}
@media(max-width:840px){
 .shell{grid-template-columns:minmax(0,1fr)}

 [dir=rtl] .rail{transform:translateX(105%)}.rail.open{transform:none}
 .rail .tx,.brand b{display:initial}.nav button{justify-content:flex-start;padding:11px 12px}.nav .bdg{position:static}.brand{justify-content:flex-start}.me{flex-direction:row}
 .mo{display:inline-block}
 .cart{position:fixed;inset-inline:0;bottom:0;height:auto;z-index:40;border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);border:0;overflow:hidden}
 .cart.open{height:88vh;height:88dvh}
 .cart:not(.open) .cbody{display:none}
 .cbar{display:flex;padding-bottom:max(13px,env(safe-area-inset-bottom))}.cart.open .cbar{padding-bottom:13px}
 .hide-m{display:none}
 #main{padding:12px 12px 96px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
}
@media(max-width:560px){.hm{display:none}.kpi b{font-size:17px}.top h1{font-size:16px}}

</style>

<script>
/* ====== CONFIG FIREBASE (optionnel) : collez ici la config de votre projet pour synchroniser plusieurs appareils ====== */

const IDB={db:null,
 open(){return new Promise((res,rej)=>{if(this.db)return res();if(!window.indexedDB)return rej(Error('IndexedDB'));const q=indexedDB.open('rbevent',1);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps')};q.onsuccess=()=>{this.db=q.result;res()};q.onerror=()=>rej(q.error)})},
 req(st,mode,fn){return new Promise((res,rej)=>{const tx=this.db.transaction(st,mode),r=fn(tx.objectStore(st));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})},
 get(st,k){return this.req(st,'readonly',s=>s.get(k))},set(st,k,v){return this.req(st,'readwrite',s=>s.put(v,k))},
 del(st,k){return this.req(st,'readwrite',s=>s.delete(k))},keys(st){return this.req(st,'readonly',s=>s.getAllKeys())}};
async function saveLocal(c){if(IDB.db){try{await IDB.set('kv',c,D[c]);return}catch(e){console.warn(e)}}
 try{localStorage['b_'+c]=JSON.stringify(D[c])}catch(e){toast('⚠ '+L('Stockage plein : faites une sauvegarde','الذاكرة عامرة'),5000)}}
async function put(c,o){o.id=o.id||uid();const i=D[c].findIndex(x=>x.id==o.id);i<0?D[c].push(o):D[c][i]=o;
 if(useFB)await db.collection(c).doc(o.id).set(JSON.parse(JSON.stringify(o)));else await saveLocal(c);dirty();return o}
async function rm(c,id){D[c]=D[c].filter(x=>x.id!=id);
 if(useFB)await db.collection(c).doc(id).delete();else await saveLocal(c);dirty()}
async function loadAll(){
 if(useFB){for(const c of COLS){const s=await db.collection(c).get();D[c]=s.docs.map(d=>d.data())}return}
 try{await IDB.open()}catch(e){console.warn(e)}
 for(const c of COLS){let v;if(IDB.db){try{v=await IDB.get('kv',c)}catch(e){}}
  if(v==null&&localStorage['b_'+c]){try{v=JSON.parse(localStorage['b_'+c])}catch(e){v=[]}if(IDB.db)await IDB.set('kv',c,v)}
  D[c]=Array.isArray(v)?v:[]}}
async function adj(id,d,force){const i=itemOf(id);if(!i||(!force&&typeof i.stock!='number'))return;i.stock=Math.round(((i.stock||0)+d)*1000)/1000;
 if(useFB)await db.collection('items').doc(id).update({stock:typeof i.stock=='number'&&!force?firebase.firestore.FieldValue.increment(d):i.stock});else await saveLocal('items');dirty()}
async function patch(id,o){const i=itemOf(id);Object.assign(i,o);if(useFB)await db.collection('items').doc(id).update(o);else await saveLocal('items');dirty()}
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bq1'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(p)}}
function shrink(f){return new Promise(res=>{const fb=()=>{if(f.size>900000){alert('Photo trop lourde / الصورة كبيرة بزاف');return res('')}const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=()=>res('');r.readAsDataURL(f)};
 try{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{try{const k=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.65))}catch(e){fb()}};im.onerror=fb;im.src=u}catch(e){fb()}})}

 const head=tk?`<div style="text-align:center;border-bottom:2px dashed #000;padding-bottom:8px"><img src="${LOGO}" style="width:60px;height:60px;border-radius:50%"><div style="font-size:17px;font-weight:700">${esc(s.shop||shop())}</div><div style="font-size:11px">📞 ${esc(phones())}</div><div style="margin-top:6px;font-weight:700">${t('invoice')} N° ${pad(s.no)}</div><div style="font-size:11px">${new Date(s.date).toLocaleString('fr-FR')}</div></div>`
 :`<div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid #1565c0;padding-bottom:10px"><img src="${LOGO}" style="width:84px;height:84px;border-radius:50%"><div style="flex:1;text-align:${a}"><div style="font-size:24px;font-weight:700;color:#1565c0">${esc(s.shop||shop())}</div><div style="font-size:14px;margin-top:4px">📞 ${esc(phones())}</div></div><div style="text-align:${e}"><div style="font-size:22px;font-weight:700">${t('invoice')}</div><div>N° ${pad(s.no)}</div><div style="font-size:13px">${new Date(s.date).toLocaleString('fr-FR')}</div></div></div>`;
 const row=(l,v,st)=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:2px 0;${st||''}"><span>${l}</span><span>${v}</span></div>`;
 return `<div dir="${rtl?'rtl':'ltr'}" style="font-family:Arial,sans-serif;color:#000;background:#fff;padding:${tk?4:8}px;font-size:${fs}px;${tk?'max-width:290px;margin:0 auto':''}">${head}
 <p style="margin:10px 0;text-align:${a}">${t('client')}: <b>${esc(s.client)}</b><br>${t('seller')}: <b>${esc(sname(s))}</b></p>
 <table style="width:100%;border-collapse:collapse;font-size:${fs}px"><tr style="background:${tk?'#000':'#1565c0'};color:#fff"><th style="padding:${pp}px;text-align:${a}">${t('name')}</th><th>${t('qty')}</th>${tk?'':`<th>${t('unit')}</th>`}<th style="text-align:${e};padding:${pp}px">${t('total')}</th></tr>
 ${s.lines.map(l=>`<tr><td style="padding:${pp}px;text-align:${a};${bd}">${esc(l.n)}${tk?`<br><span style="font-size:10px">${dh(l.p)}${l.u=='kg'?'/kg':''}</span>`:''}</td><td style="text-align:center;${bd}">${l.u=='kg'?l.q+' g':l.q}</td>${tk?'':`<td style="text-align:center;${bd}">${dh(l.p)}${l.u=='kg'?'/kg':''}</td>`}<td style="padding:${pp}px;text-align:${e};${bd}">${dh(ll(l))}</td></tr>`).join('')}</table>
 <div style="margin-top:10px;${tk?'':`margin-${a}:45%`}">${s.disc?row(L('Sous-total','المجموع الفرعي'),dh(s.sub))+row(t('discount'),'-'+dh(s.disc)):''}${row(t('total'),dh(s.total),`font-size:${tk?17:20}px;font-weight:700;color:${tk?'#000':'#1565c0'};border-top:1px solid #000;padding-top:5px;margin-top:4px`)}
 ${row(L('Paiement','الأداء'),payLab(spay(s)))}${s.recv?row(L('Reçu','المستلم'),dh(s.recv))+row(L('Rendu','الباقي للكليان'),dh(s.change)):''}${due>0.001?row(L('Payé','المدفوع'),dh(spaid(s)))+row('<b>'+L('Reste à payer (crédit)','الباقي (كريدي)')+'</b>','<b>'+dh(due)+'</b>'):''}
 ${rt.length?row('↩ '+L('Retours / remboursés','المرجوعات'),'-'+dh(sum(rt,'amount')),'color:#c62828'):''}</div>
 <p style="text-align:center;margin-top:${tk?14:26}px;font-size:${tk?11:13}px;color:#555">${t('thanks')}<br>📞 ${esc(phones())}</p></div>`}
function docWrap(title,body){const rtl=S.lang=='ar',tk=ticket();return `<div dir="${rtl?'rtl':'ltr'}" style="font-family:Arial,sans-serif;color:#000;background:#fff;padding:8px;font-size:${tk?12:14}px;${tk?'max-width:290px;margin:0 auto':''}"><div style="text-align:center;border-bottom:2px solid #1565c0;padding-bottom:8px;margin-bottom:10px"><img src="${LOGO}" style="width:${tk?56:70}px;height:${tk?56:70}px;border-radius:50%"><div style="font-size:${tk?16:20}px;font-weight:700;color:#1565c0">${esc(shop())}</div><div style="font-size:12px">📞 ${esc(phones())}</div><div style="font-size:${tk?15:18}px;font-weight:700;margin-top:6px">${title}</div><div style="font-size:12px">${new Date().toLocaleString('fr-FR')}</div></div>${body}</div>`}
const drow=(l,v,b)=>`<tr><td style="padding:5px;border-bottom:1px solid #ddd">${l}</td><td style="padding:5px;border-bottom:1px solid #ddd;text-align:end;white-space:nowrap;${b?'font-weight:700':''}">${v}</td></tr>`;
const dtab=rows=>`<table style="width:100%;border-collapse:collapse">${rows}</table>`;
function printHTML(html){try{$('inv').innerHTML=html;$('pgst').textContent=ticket()&&!html.includes('data-a4')?'@page{size:80mm auto;margin:2mm}':'@page{size:A4;margin:10mm}';setTimeout(()=>{try{print()}catch(e){toast('Impression bloquée : '+e.message,5000)}},250)}catch(e){toast('Impression : '+e.message,5000)}}
function showDoc(html,name,extra){const m=modalEl(`<div class=box style="max-width:680px"><div class=docv>${html}</div>
 ${embedded?`<p class="sm bad">⚠ ${t('embed')} <a href="${location.href}" target="_blank">↗</a></p>`:''}
 <div class=row style="margin-top:12px"><button class="btn p" id=db1>🖨 ${t('print')}</button><button class="btn p" id=db2>⬇ PDF</button>${extra||''}<button class=btn id=db3>✕ ${t('close')}</button></div></div>`,'ivm',65);
 $('db1').onclick=()=>printHTML(html);$('db2').onclick=()=>pdfHTML(html,name||'document');$('db3').onclick=()=>m.remove()}
function showInv(s){if(!s)return;showDoc(invHTML(s),'facture_'+pad(s.no),isA()?`<button class=btn onclick="closeM('ivm');retModal('${s.id}')">↩ ${L('Retour','رجوع')}</button>`:'')}
async function pdfHTML(html,name){let d;try{toast('PDF…',2000);
 await loadLib('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas);
 await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf);
 d=document.createElement('div');d.style.cssText='position:fixed;left:-9999px;top:0;width:720px;background:#fff;padding:20px';d.innerHTML=html;document.body.appendChild(d);
 await new Promise(r=>setTimeout(r,150));const c=await html2canvas(d,{scale:2,backgroundColor:'#ffffff'});d.remove();d=null;
 const pdf=new jspdf.jsPDF('p','mm','a4'),W=190,H=c.height*W/c.width,PH=277,img=c.toDataURL('image/jpeg',.92),fn=name+'.pdf';
 pdf.addImage(img,'JPEG',10,10,W,H);for(let off=PH;off<H;off+=PH){pdf.addPage();pdf.addImage(img,'JPEG',10,10-off,W,H)}
 const blob=pdf.output('blob'),file=new File([blob],fn,{type:'application/pdf'});
 if(/Android|iPhone|iPad/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:fn});return}catch(e){if(e.name=='AbortError')return}}
 dl(blob,fn);toast('✔ '+fn,2500)}catch(err){if(d)d.remove();toast('PDF impossible : '+err.message+(embedded?' — '+t('embed'):''),6000)}}
V.inv=function(){const q=S.invQ.trim().toLowerCase();let A=[...D.sales].sort((a,b)=>a.date<b.date?1:-1);if(!isA())A=A.filter(s=>s.day>=addDays(today(),-7));
 if(q)A=A.filter(s=>String(s.no)==q.replace(/^0+/,'')||String(s.client).toLowerCase().includes(q)||sname(s).toLowerCase().includes(q));A=A.slice(0,300);
 return `<div class=bar><input id=iq value="${esc(S.invQ)}" placeholder="🔍 N° ${L('facture','فاتورة')} / ${t('client')} / ${t('seller')}" oninput="S.invQ=this.value;deb(r)"></div>${isA()?'':`<p class="sm mut">${L('Factures des 7 derniers jours','فواتير آخر 7 أيام')}</p>`}
 <div class="card sc" style="padding:6px 10px"><table class=tbl><thead><tr><th>N°</th><th>Date</th><th>${t('client')}</th><th>${t('total')}</th><th>${L('Paiement','الأداء')}</th><th></th></tr></thead><tbody>${A.map(s=>{const due=s.total-spaid(s),rt=retOf(s.id);return `<tr><td><b>${pad(s.no)}</b></td><td class=sm>${fdt(s.date)}</td><td>${esc(s.client)}<br><span class="sm mut">${esc(sname(s))}</span></td><td><b>${dh(s.total)}</b>${rt?`<br><span class="badge warn">↩ -${dh(rt)}</span>`:''}</td><td class=sm>${payLab(spay(s))}${due>0.001?`<br><span class="badge bad">${L('Reste','الباقي')} ${dh(due)}</span>`:''}</td><td class=act><button class=ib onclick="showInv(saleOf('${s.id}'))">🧾</button>${isA()?`<button class=ib title="${L('Retour','رجوع')}" onclick="retModal('${s.id}')">↩</button><button class="ib dng" onclick="delSale('${s.id}')">🗑</button>`:''}</td></tr>`}).join('')||`<tr><td colspan=6 class=empty>${t('empty')}</td></tr>`}</tbody></table></div>`};
function delSale(id){const sl=saleOf(id);if(!sl)return;ask(t('sure')+` ${t('del')} ${t('invoice')} N° ${pad(sl.no)} ? <br><span class="sm mut">${L('Le stock sera remis à jour.','المخزون غادي يرجع.')}</span>`,async()=>{const rts=D.returns.filter(x=>x.saleId==id);
 for(const [k0,l] of sl.lines.entries()){if(!l.id)continue;const k=l.k??k0;let back=l.q;rts.forEach(x=>x.restock&&x.lines.forEach(rl=>{if(rl.k==k)back-=rl.q}));if(back>0)await adj(l.id,l.u=='kg'?back/1000:back)}
 for(const x of rts)await rm('returns',x.id);await rm('sales',id);r()})}

/* ---------- Retours & remboursements ---------- */
function retQty(sid,k){return sum(D.returns.filter(x=>x.saleId==sid).flatMap(x=>x.lines).filter(l=>l.k==k),'q')}
function retModal(id){const s=saleOf(id);if(!s)return;const ratio=s.sub>0?s.total/s.sub:1;S.rt={id,ratio,q:{}};const due=s.total-spaid(s);
 modalEl(`<div class=box style="max-width:580px"><div class=mh><h3>↩ ${L('Retour / remboursement','رجوع / تعويض')} — N° ${pad(s.no)}</h3><button class=x onclick="closeM('rtm')">✕</button></div><p class="sm mut" style="margin-top:0">${esc(s.client)} · ${fdt(s.date)} · ${t('total')} ${dh(s.total)}</p>
 <div class=sc><table class=tbl><thead><tr><th>${t('name')}</th><th>${L('Vendu','مباع')}</th><th>${L('Déjà retourné','رجع')}</th><th>${L('À retourner','للإرجاع')}</th></tr></thead><tbody>
 ${s.lines.map((l,k0)=>{const k=l.k??k0,rq=retQty(s.id,k),max=l.q-rq,kg=l.u=='kg';return `<tr><td>${esc(l.n)}<br><span class="sm mut">${dh(l.p)}${kg?'/kg':''}</span></td><td>${l.q}${kg?' g':''}</td><td>${rq}${kg?' g':''}</td><td><div class=row style="flex-wrap:nowrap;align-items:center;gap:4px"><input id=rq${k} type=number min=0 max=${max} step=${kg?50:1} value=0 style="width:80px" ${max<=0?'disabled':''} oninput="S.rt.q[${k}]=Math.min(${max},Math.max(0,num(this.value)));rtCalc()"><button class="ib" style="flex:0 0 auto" ${max<=0?'disabled':''} onclick="$('rq${k}').value=${max};S.rt.q[${k}]=${max};rtCalc()">${L('Tout','كلشي')}</button></div></td></tr>`}).join('')}</tbody></table></div>
 <div class=row><div><label>${L('Montant remboursé (DH)','المبلغ المرجوع')}</label><input id=rta type=number step=0.01 inputmode=decimal value=0></div><div><label>${L('Mode de remboursement','طريقة التعويض')}</label><select id=rtmd>${s.clientId?`<option value=credit ${due>0.001?'selected':''}>📒 ${L('Déduire du crédit / avoir client','نقص من الكريدي')}</option>`:''}<option value=cash ${s.clientId&&due>0.001?'':'selected'}>${payLab('cash')}</option><option value=card>${payLab('card')}</option><option value=transfer>${payLab('transfer')}</option></select></div></div>
 <label class=chk><input type=checkbox id=rtr checked> ${L('Remettre les articles en stock','رجّع السلعة للمخزون')}</label>
 <input id=rtn placeholder="${L('Motif (optionnel)','السبب (اختياري)')}">
 <div class=row style="margin-top:8px"><button class=btn onclick="closeM('rtm')">${t('cancel')}</button><button class="btn p" onclick="saveRet()">✔ ${L('Valider le retour','أكّد الرجوع')}</button></div></div>`,'rtm',70)}
function rtCalc(){const s=saleOf(S.rt.id);let v=0;s.lines.forEach((l,k0)=>{const k=l.k??k0,q=S.rt.q[k]||0;if(q)v+=ll({...l,q})});$('rta').value=r2(v*S.rt.ratio)}
async function saveRet(){const s=saleOf(S.rt.id),lines=[];s.lines.forEach((l,k0)=>{const k=l.k??k0,q=S.rt.q[k]||0;if(q>0)lines.push({k,id:l.id,n:l.n,q,p:l.p,c:l.c,u:l.u,cat:l.cat||''})});
 if(!lines.length)return toast(L('Indiquez les quantités à retourner','ختار الكمية'));
 const amount=r2(num($('rta').value)),restock=$('rtr').checked,method=$('rtmd').value;
 const x={no:s.no,saleId:s.id,clientId:s.clientId||'',client:s.client,lines,amount,cost:restock?r2(lines.reduce((a,l)=>a+lc(l),0)):0,method,restock,note:$('rtn').value.trim(),date:new Date().toISOString(),day:today(),user:S.user.username,sellerName:S.user.name};
 await put('returns',x);if(restock)for(const l of lines)if(l.id)await adj(l.id,l.u=='kg'?l.q/1000:l.q);
 closeM('rtm');toast('✔ '+L('Retour enregistré','تسجل الرجوع'),2000);r();showDoc(retHTML(x),'retour_'+pad(x.no))}
function retHTML(x){return docWrap(L('Bon de retour / avoir','وصل الرجوع')+' — '+t('invoice')+' N° '+pad(x.no),`<p>${t('client')}: <b>${esc(x.client)}</b></p>${dtab(x.lines.map(l=>drow(esc(l.n)+' × '+(l.u=='kg'?l.q+' g':l.q),dh(ll(l)))).join('')+drow('<b>'+L('Montant remboursé','المبلغ المرجوع')+'</b>',dh(x.amount),1)+drow(L('Mode','الطريقة'),x.method=='credit'?'📒 '+L('Déduit du crédit client','نقص من الكريدي'):payLab(x.method)))}${x.note?`<p>${L('Motif','السبب')}: ${esc(x.note)}</p>`:''}<p style="margin-top:30px">${L('Signature','الإمضاء')} : ____________</p>`)}
V.ret=function(){const A=[...D.returns].sort((a,b)=>a.date<b.date?1:-1),mo=today().slice(0,7),M=A.filter(x=>x.day.slice(0,7)==mo);
 return `<div class=kpis>${kpi(L('Retours ce mois','مرجوعات الشهر'),M.length)}${kpi(L('Remboursé ce mois','المرجوع هاد الشهر'),dh(sum(M,'amount')),'bad')}${kpi(L('Total retours','مجموع المرجوعات'),A.length)}</div>
 <div class=card><h3>➕ ${L('Nouveau retour','رجوع جديد')}</h3><div class=row><input id=rno type=number inputmode=numeric placeholder="N° ${L('de facture','الفاتورة')}" onkeydown="if(event.key=='Enter')findRet()"><button class="btn p" style="flex:0 0 auto" onclick="findRet()">🔍 ${L('Chercher la facture','قلب على الفاتورة')}</button></div><p class="sm mut">${L('Vous pouvez aussi utiliser le bouton ↩ dans la liste des factures.','تقدر تستعمل الزر ↩ ف الفواتير.')}</p></div>
 <div class="card sc" style="padding:6px 10px"><table class=tbl><thead><tr><th>Date</th><th>${t('invoice')}</th><th>${t('client')}</th><th>${t('articles')}</th><th>${L('Montant','المبلغ')}</th><th>${L('Mode','الطريقة')}</th><th></th></tr></thead><tbody>${A.map(x=>`<tr><td class=sm>${fdt(x.date)}</td><td>N° ${pad(x.no)}</td><td>${esc(x.client)}</td><td class=sm>${x.lines.map(l=>esc(l.n)+' ×'+(l.u=='kg'?l.q+'g':l.q)).join(', ')}${x.restock?'':` <span class="badge warn">${L('non restocké','ما رجعش للمخزون')}</span>`}</td><td><b class=bad>-${dh(x.amount)}</b></td><td class=sm>${x.method=='credit'?'📒 '+L('Avoir','كريدي'):payLab(x.method)}</td><td class=act><button class=ib onclick="showDoc(retHTML(D.returns.find(z=>z.id=='${x.id}')),'retour')">🧾</button><button class="ib dng" onclick="delRet('${x.id}')">🗑</button></td></tr>`).join('')||`<tr><td colspan=7 class=empty>${t('empty')}</td></tr>`}</tbody></table></div>`};
function findRet(){const n=num($('rno').value),s=D.sales.find(x=>x.no==n);if(!s)return toast(L('Facture introuvable','الفاتورة ما كايناش'),2500);retModal(s.id)}
function delRet(id){const x=D.returns.find(z=>z.id==id);ask(L('Annuler ce retour ?','تلغي هاد الرجوع؟')+(x.restock?'<br><span class="sm mut">'+L('Les quantités seront retirées du stock.','الكمية غادي تنقص من المخزون.')+'</span>':''),async()=>{if(x.restock)for(const l of x.lines)if(l.id)await adj(l.id,-(l.u=='kg'?l.q/1000:l.q));await rm('returns',id);r()})}

/* ---------- Clients & crédits ---------- */
function cbal(id){return r2(sum(D.sales.filter(s=>s.clientId==id),s=>s.total-spaid(s))-sum(D.payments.filter(p=>p.clientId==id),'amount')-sum(D.returns.filter(x=>x.clientId==id&&x.method=='credit'),'amount'))}
V.cli=function(){const q=(S.cq||'').toLowerCase(),A=D.clients.filter(c=>!q||c.name.toLowerCase().includes(q)||(c.phone||'').includes(q)).map(c=>({...c,bal:cbal(c.id),tot:sum(D.sales.filter(s=>s.clientId==c.id),'total')})).sort((a,b)=>b.bal-a.bal||a.name.localeCompare(b.name));
 const tb=sum(D.clients,c=>Math.max(0,cbal(c.id))),td=today();
 return `<div class=kpis>${kpi(L('Clients','الكليان'),D.clients.length)}${kpi(L('Crédits en cours','الكريدي الجاري'),dh(tb),'bad')}${kpi(L('Clients débiteurs','كليان عندهم الكريدي'),D.clients.filter(c=>cbal(c.id)>0.001).length,'warn')}${kpi(L('Encaissé aujourd\'hui','تخلص اليوم'),dh(sum(D.payments.filter(p=>p.day==td),'amount')),'ok')}</div>
 <div class=bar><input id=cqi value="${esc(S.cq||'')}" placeholder="🔍 ${L('Nom ou téléphone','السمية ولا التيليفون')}" oninput="S.cq=this.value;deb(r)"><button class="btn p" onclick="cliForm()">➕ ${L('Nouveau client','كليان جديد')}</button></div>
 <div class="card sc" style="padding:6px 10px"><table class=tbl><thead><tr><th>${t('client')}</th><th>📞</th><th>${L('Achats','المشتريات')}</th><th>${L('Solde dû','الباقي')}</th><th></th></tr></thead><tbody>${A.map(c=>`<tr><td><b>${esc(c.name)}</b>${c.note?`<br><span class="sm mut">${esc(c.note)}</span>`:''}</td><td>${c.phone?`<a href="tel:${esc(c.phone)}">${esc(c.phone)}</a>`:'-'}</td><td>${dh(c.tot)}</td><td><b class="${c.bal>0.001?'bad':'ok'}">${dh(c.bal)}</b></td><td class=act><button class="btn sm g" onclick="payModal('${c.id}')">💰 ${L('Paiement','خلاص')}</button><button class=ib title="${L('Relevé','كشف')}" onclick="showDoc(cliStmt('${c.id}'),'releve')">📄</button><button class=ib onclick="cliForm('${c.id}')">✏️</button>${isA()?`<button class="ib dng" onclick="delCli('${c.id}')">🗑</button>`:''}</td></tr>`).join('')||`<tr><td colspan=5 class=empty>${t('empty')}</td></tr>`}</tbody></table></div>`};
function cliForm(id,fromCart){const c=id?D.clients.find(x=>x.id==id):{name:fromCart?S.client:'',phone:'',note:''};
 modalEl(`<div class=box><div class=mh><h3>${id?'✏️':'➕'} ${L('Client','كليان')}</h3><button class=x onclick="closeM('clm')">✕</button></div><label>${t('full')}</label><input id=cn1 value="${esc(c.name)}"><label>📞 ${L('Téléphone','التيليفون')}</label><input id=cn2 type=tel value="${esc(c.phone||'')}"><label>${L('Note','ملاحظة')}</label><input id=cn3 value="${esc(c.note||'')}">
 <div class=row style="margin-top:10px"><button class=btn onclick="closeM('clm')">${t('cancel')}</button><button class="btn p" onclick="saveCli('${id||''}',${!!fromCart})">💾 ${t('save')}</button></div></div>`,'clm',75);setTimeout(()=>$('cn1')&&$('cn1').focus(),50)}
async function saveCli(id,fromCart){const name=$('cn1').value.trim();if(!name)return toast(L('Nom obligatoire','السمية ضرورية'));

V.sta=function(){const f=S.from,to=S.to,As=D.sales.filter(s=>inP(s,f,to)),R=D.returns.filter(x=>inP(x,f,to)),E=D.expenses.filter(x=>inP(x,f,to)),P=D.payments.filter(x=>inP(x,f,to)),Pu=D.purchases.filter(x=>inP(x,f,to));
 const ca=sum(As,'total'),ret=sum(R,'amount'),gp=sum(As,'profit')-sum(R,retImpact),ex=sum(E,'amount'),np=gp-ex,n=As.length,avg=n?ca/n:0,cr=sum(As,s=>s.total-spaid(s));
 const nd=dayDiff(f,to)+1,pf=addDays(f,-nd),pt=addDays(f,-1),Ap=D.sales.filter(s=>inP(s,pf,pt)),Rp=D.returns.filter(x=>inP(x,pf,pt)),Ep=D.expenses.filter(x=>inP(x,pf,pt));
 const cap=sum(Ap,'total'),npp=sum(Ap,'profit')-sum(Rp,retImpact)-sum(Ep,'amount'),avgp=Ap.length?cap/Ap.length:0;

 else{let m=f.slice(0,7);while(m<=to.slice(0,7)){const mm=m;ev.push({l:mm.slice(5)+'/'+mm.slice(2,4),v:sum(As.filter(s=>s.day.slice(0,7)==mm),'total')});const[y,mo]=m.split('-').map(Number);m=mo==12?`${y+1}-01`:`${y}-${String(mo+1).padStart(2,'0')}`}}
 const byCat={},byPay={},hours=Array(24).fill(0),wd=Array(7).fill(0),prod={},cli={};
 As.forEach(s=>{const ratio=s.sub>0?s.total/s.sub:1,h=new Date(s.date).getHours();hours[h]+=s.total;wd[new Date(s.day+'T12:00:00').getDay()]+=s.total;byPay[spay(s)]=(byPay[spay(s)]||0)+s.total;

 const hmin=Math.min(...hours.map((v,i)=>v?i:24),9),hmax=Math.max(...hours.map((v,i)=>v?i:0),20);
 const tp=Object.entries(prod).sort((a,b)=>b[1].v-a[1].v).slice(0,10);
 return periodBar()+`<div class=kpis>${kpi(t('ca'),dh(ca),'',dlt(ca,cap))}${kpi(L('Retours','المرجوعات'),dh(ret),'bad')}${kpi(L('CA net','رقم المعاملات الصافي'),dh(ca-ret))}${kpi(L('Marge brute','الربح الخام'),dh(gp),'ok',`<small>${ca-ret>0?Math.round(gp/(ca-ret)*100)+'% '+L('de marge','هامش'):''}</small>`)}${kpi(L('Dépenses','المصاريف'),dh(ex),'bad')}${kpi(L('Bénéfice net','الربح الصافي'),dh(np),np>=0?'ok':'bad',dlt(np,npp))}${kpi(t('nb'),n,'',dlt(n,Ap.length))}${kpi(L('Panier moyen','متوسط السلة'),dh(avg),'',dlt(avg,avgp))}${kpi(L('Crédits accordés','الكريدي اللي تعطى'),dh(cr),'warn')}${kpi(L('Crédits encaissés','الكريدي اللي تخلص'),dh(sum(P,'amount')),'ok')}${kpi(L('Achats fournisseurs','المشتريات'),dh(sum(Pu,'total')))}${kpi(L('Valeur du stock','قيمة المخزون'),dh(sum(D.items,i=>typeof i.stock=='number'&&i.stock>0?i.stock*i.cost:0)))}</div>
 <div class=card><h3>📈 ${L('Évolution du chiffre d\'affaires','تطور رقم المعاملات')}</h3>${vbars(ev)}</div>

 A.sort((a,b)=>a.cat==b.cat?a.name.localeCompare(b.name):a.cat<b.cat?-1:1);
 const tr=D.items.filter(i=>typeof i.stock=='number');
 return `<div class=kpis>${kpi(t('articles'),D.items.length)}${kpi(L('Valeur stock (achat)','قيمة المخزون (شراء)'),dh(sum(tr,i=>i.stock>0?i.stock*i.cost:0)))}${kpi(L('Valeur stock (vente)','قيمة المخزون (بيع)'),dh(sum(tr,i=>i.stock>0?i.stock*i.price:0)),'ok')}${kpi('⚠ '+t('lowstock'),D.items.filter(isLow).length,'warn')}${kpi(L('Ruptures','مقطوعة'),tr.filter(i=>i.stock<=0).length,'bad')}</div>
 <div class=bar><select onchange="S.stkC=this.value;r()"><option value="">${t('all')} — ${t('categories')}</option>${CATS.map(x=>`<option value="${x.id}" ${c==x.id?'selected':''}>${lab(x)}</option>`).join('')}</select><input id=sq placeholder="🔍 ${t('name')} / ${L('code','الكود')}" value="${esc(S.stkQ||'')}" oninput="S.stkQ=this.value;deb(r)"><label class="chk" style="flex:0 0 auto;margin-bottom:12px"><input type=checkbox ${S.stkLow?'checked':''} onchange="S.stkLow=this.checked;r()"> ${t('lowstock')}</label></div>
 <div class=bar style="margin-top:-6px"><button class="btn p" onclick="openForm()">➕ ${L('Nouvel article','سلعة جديدة')}</button><button class=btn onclick="newPur()">📥 ${L('Entrée fournisseur','دخول من المورد')}</button><button class=btn onclick="labelModal(${JSON.stringify(A.map(i=>i.id)).replace(/"/g,"'")})">🏷 ${L('Étiquettes (liste)','الملصقات')}</button><button class=btn onclick="xlStock()">⬇ Excel</button></div>
 <div class="card sc" style="padding:6px 10px"><table class=tbl><thead><tr><th>${t('name')}</th><th>${t('stock')}</th><th>${L('Entrée / sortie','زيد / نقص')}</th><th>Min</th><th></th></tr></thead><tbody>
 ${A.map(i=>{const trk=typeof i.stock=='number',low=isLow(i);return `<tr><td>${i.img?`<img src="${i.img}" style="width:38px;height:38px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-inline-end:8px;float:inline-start">`:''}<b>${esc(i.name)}</b><br><span class="sm mut">${EM[i.cat]||''} ${lab(CATS.find(x=>x.id==i.cat)||{fr:'-',ar:'-'})}${i.code?' · ▦ '+esc(i.code):''}<br>${L('Achat','شراء')} ${dh(i.cost)} · <b class=ok>${L('Vente','بيع')} ${dh(i.price)}${sfx(i)}</b></span></td>
 <td style="white-space:nowrap"><input style="width:74px;margin:0;${low?'border-color:var(--bad);color:var(--bad);font-weight:700':''}" type=number step=any inputmode=decimal value="${trk?i.stock:''}" placeholder="—" onchange="setStock('${i.id}',this.value)"> <span class=sm>${u(i)}</span></td>
 <td style="white-space:nowrap"><input style="width:62px;margin:0" type=number step=any inputmode=decimal id="ad${i.id}" placeholder="${t('qty')}"> <button class="btn sm g" title="${L('Ajouter au stock','زيد للمخزون')}" onclick="mvStock('${i.id}',1)">＋</button> <button class="btn sm r" title="${L('Retirer du stock','نقص من المخزون')}" onclick="mvStock('${i.id}',-1)">－</button></td>
 <td><input style="width:56px;margin:0" type=number step=any value="${i.min||''}" onchange="setMin('${i.id}',this.value)"></td>
 <td class=act><button class=ib onclick="openForm('${i.id}')">✏️</button><button class=ib title="${L('Étiquette code-barres','ملصق')}" onclick="labelModal(['${i.id}'])">🏷</button><button class="ib dng" title="${t('del')}" onclick="delItem('${i.id}')">🗑</button></td></tr>`}).join('')||`<tr><td colspan=5 class=empty>${t('empty')}</td></tr>`}</tbody></table></div>`};
async function setStock(id,v){if(v===''){const i=itemOf(id);delete i.stock;if(useFB)await db.collection('items').doc(id).update({stock:firebase.firestore.FieldValue.delete()});else await saveLocal('items');toast('✔');return r()}await patch(id,{stock:num(v)});toast('✔');r()}
async function setMin(id,v){await patch(id,{min:num(v)});toast('✔');r()}
async function mvStock(id,sg){const v=num($('ad'+id).value);if(!v)return toast(L('Saisissez une quantité','دخل الكمية'));const i=itemOf(id);
 if(sg<0&&typeof i.stock=='number'&&v>i.stock)return ask(L('La quantité dépasse le stock actuel','الكمية كتفوت المخزون')+' ('+fq(i.stock,i)+'). '+L('Continuer ?','تكمل؟'),async()=>{await adj(id,-v,true);toast('✔ -'+v);r()},'OK');
 await adj(id,sg*v,true);toast('✔ '+(sg>0?'+':'-')+v+' '+(isKg(i)?'kg':t('pcs')));r()}
async function xlStock(){try{await loadLib(XLURL,()=>window.XLSX)}catch(e){return toast(e.message,3000)}const w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(D.items.map(i=>({Article:i.name,Categorie:(CATS.find(c=>c.id==i.cat)||{}).fr,Code:i.code||'',Unite:isKg(i)?'kg':'pc',Prix_revient:i.cost,Prix_vente:i.price,Stock:typeof i.stock=='number'?i.stock:'',Min:i.min||0,Valeur_achat:typeof i.stock=='number'?r2(i.stock*i.cost):''}))),'Stock');XLSX.writeFile(w,`stock_${today()}.xlsx`)}
function labelModal(ids){if(!ids.length)return toast(t('empty'));S.lbl=ids;
 modalEl(`<div class=box><div class=mh><h3>🏷 ${L('Étiquettes code-barres','ملصقات الكود')}</h3><button class=x onclick="closeM('lbm')">✕</button></div><p>${ids.length} ${t('articles')}. ${L('Les articles sans code recevront un code automatiquement.','السلع بلا كود غادي ياخدو كود أوتوماتيكيا.')}</p>
 <label>${L("Nombre d'étiquettes par article",'عدد الملصقات لكل سلعة')}</label><input id=lbn type=number min=1 value=1><label class=chk><input type=checkbox id=lbp checked> ${L('Afficher le prix','بيّن الثمن')}</label>
 <div class=row><button class=btn onclick="closeM('lbm')">${t('cancel')}</button><button class="btn p" onclick="printLabels()">🖨 ${t('print')}</button></div></div>`,'lbm',70)}
async function printLabels(){const n=Math.max(1,Math.min(200,num($('lbn').value)||1)),sp=$('lbp').checked;try{await loadLib('https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js',()=>window.JsBarcode)}catch(e){return toast(e.message,3000)}
 const its=S.lbl.map(itemOf).filter(Boolean);for(const i of its)if(!i.code)await patch(i.id,{code:genCode()});
 const box=document.createElement('div');box.setAttribute('data-a4','');box.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;font-family:Arial,sans-serif';
 its.forEach(i=>{for(let k=0;k<n;k++){const d=document.createElement('div');d.style.cssText='border:1px dashed #999;border-radius:6px;padding:3mm;text-align:center;page-break-inside:avoid;break-inside:avoid;color:#000';
  d.innerHTML=`<div style="font-size:10px;font-weight:700;color:#1565c0">${esc(shop())}</div><div style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(i.name)}</div>`;
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');const ok13=/^\d{13}$/.test(i.code)&&ean(i.code.slice(0,12))==i.code;try{JsBarcode(svg,i.code,{format:ok13?'EAN13':'CODE128',width:1.6,height:42,fontSize:13,margin:0})}catch(e){JsBarcode(svg,i.code,{format:'CODE128',width:1.6,height:42,fontSize:13,margin:0})}
  svg.style.maxWidth='100%';d.appendChild(svg);if(sp)d.insertAdjacentHTML('beforeend',`<div style="font-size:15px;font-weight:800">${dh(i.price)}${sfx(i)}</div>`);box.appendChild(d)}});
 closeM('lbm');const w=document.createElement('div');w.appendChild(box);printHTML(w.innerHTML);r()}

V.usr=function(){return `<div class=card><h3>➕ ${L('Créer un compte','زيد حساب')}</h3><div class=row><div><label>${t('full')}</label><input id=nn></div><div><label>${t('user')}</label><input id=nu autocapitalize=off></div></div><div class=row><div><label>${t('pass')} (4+)</label><input id=np type=password></div><div><label>${t('role')}</label><select id=nr><option value=seller>${t('seller')}</option><option value=admin>${t('admin')}</option></select></div><button class="btn p" style="flex:0 0 auto;margin-bottom:4px" onclick="addUser()">➕ ${t('add')}</button></div><p class="sm mut">🔒 ${L("Seul l'administrateur peut créer des comptes. La page de connexion ne permet plus d'en créer.",'غير الأدمن اللي يقدر يزيد الحسابات.')}</p></div>
 <div class="card sc" style="padding:6px 10px"><table class=tbl><thead><tr><th>${t('name')}</th><th>${t('role')}</th><th>${t('nb')}</th><th></th></tr></thead><tbody>${D.users.map(u=>`<tr><td><b>${esc(u.name)}</b><br><span class="sm mut">${esc(u.username)}</span>${u.mustChange?` <span class="badge warn">${L('mot de passe initial','كلمة سر أولية')}</span>`:''}</td><td><span class="badge ${u.role=='admin'?'':'ok'}">${t(u.role=='admin'?'admin':'seller')}</span></td><td>${D.sales.filter(s=>s.user==u.username).length}</td><td class=act><button class=ib onclick="userEdit('${u.id}')">✏️</button>${u.id==S.user.id?'':`<button class="ib dng" onclick="delUser('${u.id}')">🗑</button>`}</td></tr>`).join('')}</tbody></table></div>
 <button class=btn onclick="pwdModal()">🔑 ${L('Changer mon mot de passe','بدّل كلمة السر ديالي')}</button>`};
async function addUser(){const u=$('nu').value.trim().toLowerCase(),p=$('np').value;if(!u)return toast(L('Identifiant obligatoire','اسم المستخدم ضروري'));if(p.length<4)return toast(L('Mot de passe : 4 caractères minimum','كلمة السر 4 حروف على الأقل'));if(D.users.some(x=>x.username==u))return toast(L('Identifiant déjà utilisé','مستعمل'));
 await put('users',{username:u,name:$('nn').value.trim()||u,role:$('nr').value,hash:await hash(p)});toast('✔ '+u);r()}
function userEdit(id){const u=D.users.find(x=>x.id==id);modalEl(`<div class=box><div class=mh><h3>✏️ ${esc(u.username)}</h3><button class=x onclick="closeM('uem')">✕</button></div><label>${t('full')}</label><input id=ue1 value="${esc(u.name)}"><label>${t('role')}</label><select id=ue2 ${u.id==S.user.id?'disabled':''}><option value=seller ${u.role!='admin'?'selected':''}>${t('seller')}</option><option value=admin ${u.role=='admin'?'selected':''}>${t('admin')}</option></select><label>${L('Nouveau mot de passe (laisser vide pour ne pas changer)','كلمة سر جديدة (خليها خاوية)')}</label><input id=ue3 type=password>
 <div class=row style="margin-top:10px"><button class=btn onclick="closeM('uem')">${t('cancel')}</button><button class="btn p" onclick="saveUser('${id}')">💾 ${t('save')}</button></div></div>`,'uem',75)}
async function saveUser(id){const u=D.users.find(x=>x.id==id),p=$('ue3').value;if(p&&p.length<4)return toast('4+');u.name=$('ue1').value.trim()||u.username;if(u.id!=S.user.id)u.role=$('ue2').value;if(p){u.hash=await hash(p);u.mustChange=true}
 if(!D.users.some(x=>x.role=='admin'))return toast(L('Il faut au moins un administrateur','خاص أدمن واحد على الأقل'));await put('users',u);if(u.id==S.user.id)S.user=u;closeM('uem');toast('✔');r()}
function delUser(id){const u=D.users.find(x=>x.id==id);if(u.role=='admin'&&D.users.filter(x=>x.role=='admin').length<2)return toast(L('Impossible : dernier administrateur','ما يمكنش'));ask(t('sure')+' '+esc(u.name),async()=>{await rm('users',id);r()})}

 <p class="sm mut">${L('Espace utilisé','المساحة المستعملة')} : <span id=stor>…</span> · ${useFB?'☁️ Firebase':'📱 '+L('Données locales (cet appareil)','بيانات محلية')}</p></div>

 <p class="sm mut">⌨️ ${L('Raccourcis caisse : F2 = scanner, F9 = encaisser. Lecteur code-barres USB/Bluetooth compatible.','اختصارات: F2 سكانير، F9 خلّص.')}</p></div></div>`};
async function loadSnaps(){const el=$('snaps');if(!el)return;try{await IDB.open();const ks=(await IDB.keys('snaps')).sort().reverse();
 el.innerHTML=ks.length?`<table class=tbl><tbody>${ks.map(k=>`<tr><td><b>${/^\d{4}/.test(k)?fday(k):'⏪ '+L('Avant restauration','قبل الاسترجاع')}</b></td><td class=act><button class=ib onclick="snapDl('${k}')">⬇</button><button class="btn sm" onclick="snapRestore('${k}')">⟲ ${L('Restaurer','رجّع')}</button></td></tr>`).join('')}</tbody></table>`:`<p class=mut>${t('empty')}</p>`}catch(e){el.textContent='IndexedDB indisponible'}
 try{const q=await navigator.storage.estimate(),e2=$('stor');if(e2)e2.textContent=`${(q.usage/1048576).toFixed(1)} Mo / ${(q.quota/1048576).toFixed(0)} Mo`}catch(e){}}

 clearTimeout(rt);rt=setTimeout(()=>{const a=document.activeElement,typing=a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)&&!['scan','q'].includes(a.id);if(S.user&&!document.querySelector('.modal')&&!typing)r()},400)}))}

(async()=>{try{

}catch(e){alert('Erreur : '+e.message)}r()})();
